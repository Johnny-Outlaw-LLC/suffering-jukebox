<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rights Review | Suffering Jukebox Admin</title><link rel="stylesheet" href="/legal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><a class="brand" href="/">Suffering Jukebox Admin</a><nav><a href="/artist-upload">Artist submission</a><a href="/dmca">Public DMCA form</a><a href="/terms">Terms</a></nav></header><main><div class="eyebrow">Restricted review queue</div><h1>Rights &amp; copyright</h1><p class="lede">Approval requires independent authority verification. The applicant’s checkbox is evidence, not verification.</p><div id="gate" class="panel">Checking administrator access…</div><div id="admin" class="hidden"><div class="actions"><button onclick="showTab('artists')">Artist applications</button><button class="secondary" onclick="showTab('dmca')">DMCA notices</button><button class="secondary" onclick="loadAll()">Refresh</button></div><section id="artistsTab"></section><section id="dmcaTab" class="hidden"></section></div></main><footer>Restricted to Suffering Jukebox administrators.</footer>
<script>
const SB_URL='https://ntyvtpimesfoesuykuyi.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50eXZ0cGltZXNmb2VzdXlrdXlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMTc0NjIsImV4cCI6MjA4OTU5MzQ2Mn0.S6hw0xc4PVKZy_OBj7eu8eRpGHEqZMJ6_6p_Lut1BpQ';const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let applications=[],notices=[],accountActions=[];
async function authHeaders(){const s=(await sb.auth.getSession()).data.session;return s?{Authorization:'Bearer '+s.access_token}:{}}
async function init(){const h=await authHeaders();if(!h.Authorization){document.getElementById('gate').innerHTML='Sign in through <a href="/">Suffering Jukebox</a> first.';return}const r=await fetch('/api/sj-admin-check',{method:'POST',headers:h}),d=await r.json();if(!r.ok||!d.isAdmin){document.getElementById('gate').textContent='Administrator access required.';return}document.getElementById('gate').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');loadAll()}
async function loadAll(){document.getElementById('artistsTab').innerHTML='<div class="panel">Loading applications…</div>';document.getElementById('dmcaTab').innerHTML='<div class="panel">Loading notices…</div>';try{const h=await authHeaders(),[ar,dr]=await Promise.all([fetch('/api/sj-admin-artist-rights',{headers:h}),fetch('/api/sj-admin-dmca',{headers:h})]),[a,d]=await Promise.all([ar.json(),dr.json()]);if(!ar.ok||!a.ok)throw new Error(a.error||'Artist queue failed');if(!dr.ok||!d.ok)throw new Error(d.error||'DMCA queue failed');applications=a.applications||[];notices=d.notices||[];accountActions=d.accountActions||[];renderArtists();renderDmca()}catch(e){document.getElementById('artistsTab').innerHTML='<div class="panel danger">'+esc(e.message)+'</div>'}}
function showTab(tab){document.getElementById('artistsTab').classList.toggle('hidden',tab!=='artists');document.getElementById('dmcaTab').classList.toggle('hidden',tab!=='dmca')}
function renderArtists(){const root=document.getElementById('artistsTab');root.innerHTML='<h2>Artist applications ('+applications.length+')</h2>'+applications.map(a=>{const snap=a.agreement_snapshot?.submission||{};return '<article class="panel"><div class="status-row"><div><strong>'+esc(a.artist?.name||a.stage_name)+'</strong><div class="fine">'+esc(a.user_email)+' · submitted '+date(a.created_at)+'</div></div><span class="status '+esc(a.status)+'">'+esc(a.status)+'</span></div><div class="grid"><p><b>Signer</b><br>'+esc(a.legal_name)+'<br>'+esc(a.authority_role)+(a.organization?'<br>'+esc(a.organization):'')+'</p><p><b>Contact</b><br>'+esc(a.contact_phone||'')+'<br><a href="'+attr(a.website||'#')+'" target="_blank" rel="noopener">'+esc(a.website||'No website')+'</a></p><p><b>Master owner</b><br>'+esc(snap.masterOwner||'')+'</p><p><b>Composition owner</b><br>'+esc(snap.compositionOwner||'')+'</p><p class="full"><b>Catalog statement</b><br>'+esc(a.catalog_description||'')+'</p><p class="full"><b>Writers / publishers</b><br>'+esc(snap.writers||'')+'<br>'+esc(snap.publishers||'')+'</p></div><p class="fine">Agreement '+esc(a.agreement_version)+' · SHA-256 '+esc(a.agreement_sha256)+' · IP '+esc(a.signature_ip||'not recorded')+'</p><details><summary>'+a.tracks.length+' proposed tracks</summary><div class="track-list">'+a.tracks.map(t=>'<div class="track"><span class="status '+esc(t.status)+'">'+esc(t.status)+'</span> '+esc(t.track?.name||t.track_id)+'</div>').join('')+'</div></details>'+(a.review_note?'<p class="message"><b>Last review:</b> '+esc(a.review_note)+'</p>':'')+artistActions(a)+'</article>'}).join('')||'<div class="panel">No artist applications.</div>'}
function artistActions(a){let actions=[];if(a.status==='pending'){actions.push('<button onclick="reviewArtist(\''+a.id+'\',\'approve\')">Verify & approve</button>','<button class="danger-btn" onclick="reviewArtist(\''+a.id+'\',\'reject\')">Reject</button>')}if(a.status==='approved')actions.push('<button class="danger-btn" onclick="reviewArtist(\''+a.id+'\',\'suspend\')">Suspend</button>');if(a.status==='suspended')actions.push('<button onclick="reviewArtist(\''+a.id+'\',\'restore\')">Restore</button>');if(['pending','approved','suspended'].includes(a.status))actions.push('<button class="danger-btn" onclick="reviewArtist(\''+a.id+'\',\'revoke\')">Revoke</button>');return '<div class="actions">'+actions.join('')+'</div>'}
async function reviewArtist(id,action){if(action==='approve'&&!confirm('Have you independently verified this person can bind both the master and composition owners?'))return;const note=prompt('Enter the verification evidence or review reason. This is saved to the audit log:');if(!note||note.trim().length<12)return alert('A meaningful note is required.');await patch('/api/sj-admin-artist-rights',{agreementId:id,action,reviewNote:note,verifiedAuthority:action==='approve'});await loadAll()}
function renderDmca(){const root=document.getElementById('dmcaTab');root.innerHTML='<h2>Copyright notices ('+notices.length+')</h2><p class="fine">Active account actions: '+accountActions.filter(a=>a.active).length+'</p>'+notices.map(n=>'<article class="panel"><div class="status-row"><div><strong>'+esc(n.reference_code)+' · '+esc(n.notice_type)+'</strong><div class="fine">Received '+date(n.created_at)+'</div></div><span class="status '+esc(n.status)+'">'+esc(n.status)+'</span></div><p><b>Claimant</b><br>'+esc(n.claimant_name)+(n.claimant_organization?' · '+esc(n.claimant_organization):'')+'<br>'+esc(n.claimant_email)+' · '+esc(n.claimant_phone)+'<br>'+esc(n.claimant_address)+'</p><p><b>Claimed work</b><br>'+esc(n.copyrighted_work_description)+'</p><p><b>Material location</b><br>'+esc(n.material_location)+'</p><p><b>Target track</b><br>'+esc(n.target_track_id||'Not linked')+'</p><p class="fine">Signed '+esc(n.signature_name)+' · IP '+esc(n.submitted_ip||'not recorded')+'</p>'+(n.review_note?'<p class="message"><b>Review:</b> '+esc(n.review_note)+'</p>':'')+dmcaActions(n)+'</article>').join('')||'<div class="panel">No copyright notices.</div>'}
function dmcaActions(n){const buttons=[];if(!n.target_track_id)buttons.push('<button class="secondary" onclick="linkNotice(\''+n.id+'\')">Link catalog track</button>');if(n.notice_type==='counter_notice'&&n.status==='received')buttons.push('<button onclick="reviewNotice(\''+n.id+'\',\'forward_counter\')">Record forwarding to claimant</button>');if(['received','needs_information'].includes(n.status)&&n.notice_type==='takedown'){buttons.push('<button onclick="reviewNotice(\''+n.id+'\',\'takedown\')">Disable material</button>','<button class="secondary" onclick="reviewNotice(\''+n.id+'\',\'needs_information\')">Needs information</button>','<button class="danger-btn" onclick="reviewNotice(\''+n.id+'\',\'reject\')">Reject</button>')}if(n.status==='actioned'&&!n.subscriber_notified_at)buttons.push('<button class="secondary" onclick="reviewNotice(\''+n.id+'\',\'subscriber_notified\')">Record subscriber notice</button>');if(n.status==='countered'){buttons.push('<button onclick="reviewNotice(\''+n.id+'\',\'restore\')">Restore after waiting period</button>','<button class="danger-btn" onclick="reviewNotice(\''+n.id+'\',\'court_action\')">Record court action</button>')}if(!['closed','rejected'].includes(n.status))buttons.push('<button class="secondary" onclick="reviewNotice(\''+n.id+'\',\'close\')">Close</button>');if(n.target_user_id){buttons.push('<button class="danger-btn" onclick="reviewNotice(\''+n.id+'\',\'strike\')">Record strike</button>','<button class="danger-btn" onclick="terminateUser(\''+n.id+'\',\''+n.target_user_id+'\')">Terminate account</button>')}return '<div class="actions">'+buttons.join('')+'</div>'}
async function reviewNotice(id,action){const note=prompt('Enter the legal review record / reason:');if(!note||note.trim().length<12)return alert('A meaningful note is required.');const addStrike=action==='takedown'&&confirm('Also record an active copyright strike against the linked account?');await patch('/api/sj-admin-dmca',{noticeId:id,action,reviewNote:note,addStrike});await loadAll()}
async function linkNotice(id){const targetTrackId=prompt('Enter the exact Suffering Jukebox track UUID:');if(!targetTrackId)return;const note=prompt('Record how you matched this notice to that track:');if(!note||note.trim().length<12)return alert('A meaningful note is required.');await patch('/api/sj-admin-dmca',{noticeId:id,action:'link_track',targetTrackId,reviewNote:note});await loadAll()}
async function terminateUser(noticeId,userId){if(prompt('This bans login and suspends every public catalog. Type TERMINATE to continue:')!=='TERMINATE')return;const note=prompt('Record the repeat-infringer basis and notices reviewed:');if(!note||note.trim().length<12)return;await patch('/api/sj-admin-dmca',{noticeId,targetUserId:userId,action:'terminate',confirmation:'TERMINATE',reviewNote:note});await loadAll()}
async function patch(url,body){const r=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json',...(await authHeaders())},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Action failed');return d}
function date(s){try{return new Date(s).toLocaleString()}catch{return s||''}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}init();
</script></body></html>
