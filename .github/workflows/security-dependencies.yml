name: Security dependency validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      VERCEL_ENV: preview
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies without scripts or audit submission
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify patched native image processing
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const sharp = require('sharp');
          assert.equal(require('next/package.json').version, '16.4.3');
          assert.equal(sharp.versions.sharp, '0.35.5');
          const lock = require('./package-lock.json');
          for (const [path, value] of Object.entries(lock.packages)) {
            if (path.endsWith('node_modules/sharp')) assert.equal(value.version, '0.35.5', path);
          }
          const svg = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="red"/></svg>');
          sharp(svg).resize(4, 4).png().toBuffer({resolveWithObject:true}).then(({info}) => {
            assert.equal(info.width, 4); assert.equal(info.height, 4); assert.equal(info.format, 'png');
            console.log(JSON.stringify({next:require('next/package.json').version,sharp:sharp.versions.sharp,rsvg:sharp.versions.rsvg}));
          }).catch(error => { console.error(error); process.exitCode=1; });
          NODE
      - name: Existing tests with file-load failures enforced
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Production compilation without application prebuild hooks
        run: node node_modules/next/dist/bin/next build
