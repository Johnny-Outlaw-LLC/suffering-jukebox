name: Performance coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PERF_OPEN_ISSUES: 'true'
      PERF_WINDOW_HOURS: '24'
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run long-queue performance stress tests
        id: tests
        run: npm run test:stress
        continue-on-error: true
      - name: Check production performance logs and open a deduplicated issue
        id: perf
        run: node scripts/check-perf-logs.mjs
        continue-on-error: true
      - name: Fail if tests or production telemetry found a regression
        if: steps.tests.outcome == 'failure' || steps.perf.outcome == 'failure'
        run: exit 1
