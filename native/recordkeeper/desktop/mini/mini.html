<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: https: data:; style-src 'self' file:; script-src 'self' file:">
<title>Record Keeper Mini Player</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<main class="mini" id="mini">
<div class="row">
  <div class="art"><img id="art" alt="" src="../assets/icon.png"></div>
  <section class="body">
    <div class="top">
      <div class="meta">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist">Pick a song in Record Keeper</div>
      </div>
      <div class="win">
        <button type="button" id="pin" class="wbtn" title="Keep on top of other windows" aria-label="Always on top" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 3 3v2h-4v7l-1 1-1-1v-7H7v-2l3-3z"/></svg>
        </button>
        <button type="button" id="expand" class="wbtn" title="Back to the full window (Ctrl+Shift+M)" aria-label="Open the full window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        </button>
      </div>
    </div>
    <div class="controls">
      <button type="button" id="heart" class="cbtn" title="Send a heart at this moment" aria-label="Send a heart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
      </button>
      <button type="button" id="prev" class="cbtn" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button type="button" id="play" class="cbtn play" title="Play" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fill" id="play-ic"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button type="button" id="next" class="cbtn" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="scrub">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="0.25" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
  </section>
</div>
<div class="upnext" id="upnext">
  <span class="un-lbl">Up next</span>
  <span class="un-song" id="un-song">Nothing queued</span>
  <button type="button" id="skip-next" class="un-skip" title="Skip it: pick another song to play next" aria-label="Skip the song that is up next">Skip</button>
</div>
</main>
<script src="mini.js"></script>
</body>
</html>
